<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUN job</title>
<style>
:root{color-scheme:light;--bg:#f4f6f8;--card:#fff;--line:#e4e9ee;--text:#17212b;--muted:#6b7785;--blue:#315f8c;--blue-soft:#eef5fb;--green:#2f7659;--green-soft:#edf8f2;--amber:#9a6c1b;--amber-soft:#fff7e8;--red:#a84c4c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(244,246,248,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.header-inner{max-width:1180px;margin:auto;padding:18px 22px;display:flex;align-items:end;justify-content:space-between;gap:16px}.brand h1{margin:0;font-size:28px;letter-spacing:-.7px}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.sync{font-size:12px;color:var(--muted);white-space:nowrap}main{max-width:1180px;margin:auto;padding:22px}.section{margin-bottom:24px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}.section-title h2{margin:0;font-size:19px}.section-title .sub{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:25px;font-weight:800;margin-top:3px}.tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:grid;grid-template-columns:1fr auto;gap:8px 14px}.task .company{font-weight:800}.task .action{font-size:14px;line-height:1.5}.task .when{font-size:12px;color:var(--amber);font-weight:700;white-space:nowrap}.task a{font-size:12px;color:var(--blue);text-decoration:none}.group{margin-top:22px}.group h3{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:800}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.job{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}.job-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.company-wrap{min-width:0}.company-name{font-size:18px;font-weight:850;line-height:1.25}.role{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}.score{font-weight:900;font-size:16px;white-space:nowrap;color:var(--blue)}.badges{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0}.badge{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:750;background:#f1f4f6;color:#4d5965}.badge.interview{background:var(--green-soft);color:var(--green)}.badge.apply{background:var(--blue-soft);color:var(--blue)}.badge.wait{background:#f3f1fb;color:#65558b}.badge.hold{background:var(--amber-soft);color:var(--amber)}.next{background:var(--blue-soft);border-radius:11px;padding:10px 11px;margin:10px 0 12px}.next .k{font-size:11px;color:var(--blue);font-weight:850;margin-bottom:3px}.next .v{font-size:13px;line-height:1.5}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}.meta-box{background:#f8fafb;border:1px solid #edf0f3;border-radius:10px;padding:9px}.meta-box .k{font-size:10.5px;color:var(--muted);margin-bottom:3px}.meta-box .v{font-size:12px;line-height:1.35;overflow-wrap:anywhere}.line{font-size:12.5px;line-height:1.55;margin-top:7px}.line b{font-size:11px;margin-right:5px;color:var(--muted)}.strength b{color:var(--green)}.risk b{color:var(--red)}.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.links a{font-size:11.5px;text-decoration:none;color:var(--blue);border:1px solid var(--line);padding:5px 8px;border-radius:7px;background:#fff}.memo{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.memo label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:5px}.memo textarea{width:100%;min-height:58px;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font:inherit;font-size:12.5px;resize:vertical;background:#fbfcfd;color:var(--text)}.memo textarea:focus{outline:2px solid #b9cee1;border-color:#9ebbd5}.memo-status{font-size:10.5px;color:var(--muted);height:15px;margin-top:3px}.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);font-size:13px}.refresh{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.tasks,.cards{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.header-inner{align-items:flex-start;flex-direction:column}.sync{white-space:normal}}@media(max-width:520px){main{padding:14px}.header-inner{padding:14px}.brand h1{font-size:24px}.meta{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="header-inner"><div class="brand"><h1>JUN job</h1><p>지원 현황 · 다음 행동 · 핵심 판단만 한 페이지에</p></div><div id="sync" class="sync">DB 연결 중…</div></div></header>
<main>
<section class="stats"><div class="stat"><div class="label">진행 중</div><div class="value" id="sProgress">0</div></div><div class="stat"><div class="label">지원 예정</div><div class="value" id="sPlan">0</div></div><div class="stat"><div class="label">면접</div><div class="value" id="sInterview">0</div></div><div class="stat"><div class="label">대기 / 후순위</div><div class="value" id="sWait">0</div></div></section>
<section class="section"><div class="section-title"><div><h2>지금 할 일</h2><div class="sub">마감과 다음 일정 기준</div></div><button id="refresh" class="refresh">새로고침</button></div><div id="tasks" class="tasks"></div></section>
<section class="section"><div class="section-title"><div><h2>지원 보드</h2><div class="sub">AI 판단과 내 메모를 분리해서 표시</div></div></div><div id="groups"></div></section>
</main>
<script>
const BASE='https://iifuvchvjhzursffvvzk.supabase.co/rest/v1/';
const KEY='sb_publishable_HUif7UBTbshBV-SdR0oSYA_b1GC0iM0';
const H={apikey:KEY};let rows=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tier=n=>n>=90?'S':n>=80?'A':n>=70?'B':n>=60?'C':'D';
const d=s=>{if(!s)return '';const x=new Date(s+'T00:00:00');return (x.getMonth()+1)+'/'+x.getDate()};
const dt=s=>{if(!s)return '';const x=new Date(s);return (x.getMonth()+1)+'/'+x.getDate()+' '+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')};
const stageClass=s=>/면접/.test(s)?'interview':/지원예정/.test(s)?'apply':/지원완료|서류열람/.test(s)?'wait':'hold';
const groupOf=s=>/면접|지원완료|서류열람/.test(s)?'진행 중':/지원예정/.test(s)?'지원 예정':'후순위 / 보류';
const today=()=>{const x=new Date();x.setHours(0,0,0,0);return x};
function dueText(c){if(c.next_event_at)return '일정 '+dt(c.next_event_at);if(c.posting_deadline)return '마감 '+d(c.posting_deadline);return ''}
function actionWhen(c){if(!c.next_action_due)return '';const x=new Date(c.next_action_due+'T00:00:00'),t=today();const diff=Math.round((x-t)/86400000);if(diff<0)return '기한 지남';if(diff===0)return '오늘';if(diff===1)return '내일';return d(c.next_action_due)+'까지'}
function jobCard(c){const score=c.recommendation_score==null?'-':c.recommendation_score,t=c.recommendation_score==null?'-':tier(c.recommendation_score),deadline=dueText(c);return '<article class="job"><div class="job-top"><div class="company-wrap"><div class="company-name">'+esc(c.company_name)+'</div><div class="role">'+esc(c.job_title||'')+'</div></div><div class="score">'+esc(score)+' ('+esc(t)+')</div></div><div class="badges"><span class="badge '+stageClass(c.status)+'">'+esc(c.status)+'</span>'+(deadline?'<span class="badge">'+esc(deadline)+'</span>':'')+'</div><div class="next"><div class="k">다음 행동'+(c.next_action_due?' · '+esc(actionWhen(c)):'')+'</div><div class="v">'+esc(c.next_action||'대기')+'</div></div><div class="meta"><div class="meta-box"><div class="k">보상</div><div class="v">'+esc(c.compensation_note||'—')+'</div></div><div class="meta-box"><div class="k">영어</div><div class="v">'+esc(c.english_requirement||'—')+'</div></div><div class="meta-box"><div class="k">근무지</div><div class="v">'+esc(c.location||'—')+'</div></div></div>'+(c.quick_strengths?'<div class="line strength"><b>강점</b>'+esc(c.quick_strengths)+'</div>':'')+(c.quick_risks?'<div class="line risk"><b>주의</b>'+esc(c.quick_risks)+'</div>':'')+(c.expected_career_path?'<div class="line"><b>경력</b>'+esc(c.expected_career_path)+'</div>':'')+'<div class="links">'+(c.job_url?'<a href="'+esc(c.job_url)+'" target="_blank" rel="noopener noreferrer">공고</a>':'')+'</div><div class="memo"><label>내 메모</label><textarea data-id="'+esc(c.id)+'" aria-label="'+esc(c.company_name)+' 내 메모"></textarea><div class="memo-status" aria-live="polite"></div></div></article>'}
function renderTasks(){const list=rows.filter(c=>c.next_action&&!/회신 대기|연락 대기/.test(c.next_action)).sort((a,b)=>(a.next_action_due||'9999').localeCompare(b.next_action_due||'9999')||(a.priority_rank||99)-(b.priority_rank||99)).slice(0,6);tasks.innerHTML=list.length?list.map(c=>'<div class="task"><div><div class="company">'+esc(c.company_name)+'</div><div class="action">'+esc(c.next_action)+'</div></div><div class="when">'+esc(actionWhen(c)||dueText(c))+'</div>'+(c.job_url?'<a href="'+esc(c.job_url)+'" target="_blank" rel="noopener noreferrer">공고 보기</a>':'')+'</div>').join(''):'<div class="empty">지금 처리할 일이 없습니다.</div>'}
function renderGroups(){const names=['진행 중','지원 예정','후순위 / 보류'];groups.innerHTML=names.map(name=>{const list=rows.filter(c=>groupOf(c.status)===name).sort((a,b)=>(a.priority_rank||99)-(b.priority_rank||99));if(!list.length)return '';return '<div class="group"><h3>'+name+'</h3><div class="cards">'+list.map(jobCard).join('')+'</div></div>'}).join('');document.querySelectorAll('textarea[data-id]').forEach(el=>{const c=rows.find(x=>String(x.id)===el.dataset.id);el.value=c?.user_memo||'';el.addEventListener('change',()=>saveMemo(el));el.addEventListener('blur',()=>saveMemo(el))})}
function renderStats(){sProgress.textContent=rows.filter(c=>/지원완료|서류열람|면접/.test(c.status)).length;sPlan.textContent=rows.filter(c=>c.status==='지원예정').length;sInterview.textContent=rows.filter(c=>/면접/.test(c.status)).length;sWait.textContent=rows.filter(c=>/후순위|보류/.test(c.status)).length}
async function saveMemo(el){const box=el.parentElement.querySelector('.memo-status');box.textContent='저장 중…';const r=await fetch(BASE+'companies?id=eq.'+encodeURIComponent(el.dataset.id),{method:'PATCH',headers:{...H,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({user_memo:el.value})});if(r.ok){const c=rows.find(x=>String(x.id)===el.dataset.id);if(c)c.user_memo=el.value;box.textContent='저장됨'}else box.textContent='저장 실패'}
async function load(){sync.textContent='DB 동기화 중…';try{const r=await fetch(BASE+'companies?board_active=eq.true&select=*&order=priority_rank.asc.nullslast',{headers:H});if(!r.ok)throw Error('HTTP '+r.status);rows=await r.json();renderStats();renderTasks();renderGroups();sync.textContent='● Supabase 연결 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}catch(e){sync.textContent='DB 연결 오류 · '+e.message}}
refresh.addEventListener('click',load);load();
</script>
</body></html>
