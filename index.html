<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUN Job Command Center V3</title>
<style>:root{--bg:#0b1020;--panel:#121a2e;--muted:#8fa0bf;--text:#eef3ff;--line:#26324d;--accent:#6ea8fe;--good:#53d39b;--warn:#ffd166}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}header{padding:16px 22px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:20px}.sub,.label{color:var(--muted);font-size:12px}main{max-width:1280px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.metric{font-size:28px;font-weight:800}.section{margin-top:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}button,input,select{background:#0e1629;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px}.primary{background:var(--accent);color:#08101f;border:0;font-weight:700}.good{color:var(--good)}.warn{color:var(--warn)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted)}a{color:#9fc3ff}.pill{border:1px solid var(--line);border-radius:999px;padding:3px 7px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}table{display:block;overflow:auto}}</style></head>
<body><header><h1>JUN JOB COMMAND CENTER <span style="color:#6ea8fe">V3</span></h1><div class="sub">전기계열 첫 취업 · 기준역 연신내 · Supabase DB 연동</div><div id="sync" class="label">DB 연결 중…</div></header><main>
<section class="grid"><div class="card"><div class="label">전체 후보</div><div class="metric" id="all">0</div></div><div class="card"><div class="label">추천 70점+</div><div class="metric good" id="good">0</div></div><div class="card"><div class="label">지원 예정/완료</div><div class="metric" id="apply">0</div></div><div class="card"><div class="label">면접</div><div class="metric warn" id="interview">0</div></div></section>
<section class="section card"><h2>지원 후보 / 파이프라인</h2><div class="toolbar"><input id="q" placeholder="회사·직무 검색"><select id="fs"><option value="">상태 전체</option><option>발굴</option><option>검증중</option><option>지원예정</option><option>지원완료</option><option>서류합격</option><option>면접</option><option>제외</option></select><button class="primary" id="refresh">DB 새로고침</button></div><div style="overflow:auto"><table><thead><tr><th>점수</th><th>회사 / 직무</th><th>기사</th><th>근무지·통근</th><th>신입</th><th>경력가치</th><th>상태</th><th>메모</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="section card"><h2>운영 원칙</h2><p class="label" style="font-size:13px;line-height:1.7">전기기사 필수 공고는 현재 원칙적 제외. 신입 가능 여부, 연신내 기준 통근 시간뿐 아니라 환승·도보 부담, 경력가치, 회사 건전성, 워라밸 위험을 함께 검증한다. 확인할 수 없는 정보는 ‘문제 없음’이 아니라 ‘미확인’으로 남긴다.</p></section></main>
<script>
const API='https://iifuvchvjhzursffvvzk.supabase.co/rest/v1/companies?select=*&order=recommendation_score.desc.nullslast',KEY='sb_publishable_HUif7UBTbshBV-SdR0oSYA_b1GC0iM0';let data=[];
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){sync.textContent='DB 동기화 중…';try{let r=await fetch(API,{headers:{apikey:KEY}});if(!r.ok)throw Error(r.status);data=await r.json();sync.textContent='● Supabase DB 연결됨 · '+new Date().toLocaleTimeString('ko-KR');render()}catch(e){sync.textContent='DB 연결 오류: '+e.message}}
function render(){let x=q.value.toLowerCase(),s=fs.value,l=data.filter(c=>(!x||(String(c.company_name)+' '+String(c.job_title)).toLowerCase().includes(x))&&(!s||c.status===s));rows.innerHTML=l.map(c=>`<tr><td><b>${E(c.recommendation_score??'-')}</b></td><td>${c.job_url?`<a href="${E(c.job_url)}" target="_blank">${E(c.company_name)}</a>`:E(c.company_name)}<br><span class="label">${E(c.job_title)}</span></td><td>${E(c.license_requirement)}</td><td>${E(c.location)}<br><span class="label">${c.commute_minutes?E(c.commute_minutes)+'분 · ':''}${c.transfers!=null?E(c.transfers)+'회 환승 · ':''}${E(c.commute_grade)}</span></td><td>${c.entry_level_ok===true?'가능':c.entry_level_ok===false?'불가':'미확인'}</td><td>${E(c.career_value)}</td><td><span class="pill">${E(c.status)}</span></td><td>${E(c.notes)}</td></tr>`).join('');all.textContent=data.filter(c=>c.status!=='제외').length;good.textContent=data.filter(c=>c.status!=='제외'&&(c.recommendation_score||0)>=70).length;apply.textContent=data.filter(c=>['지원예정','지원완료'].includes(c.status)).length;interview.textContent=data.filter(c=>['서류합격','면접'].includes(c.status)).length}
q.oninput=render;fs.onchange=render;refresh.onclick=load;load();setInterval(load,60000);
</script></body></html>
